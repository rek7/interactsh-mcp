[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interactsh-mcp"
version = "0.1.0"
description = "MCP server for ProjectDiscovery's Interactsh OOB testing platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rek7", email = "raphael@zeropath.com" }]
keywords = ["mcp", "interactsh", "oob", "security", "ssrf", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
interactsh-mcp = "interactsh_mcp.server:main"

[project.urls]
Homepage = "https://github.com/rek7/interactsh-mcp"
Repository = "https://github.com/rek7/interactsh-mcp"
Issues = "https://github.com/rek7/interactsh-mcp/issues"
Upstream = "https://github.com/projectdiscovery/interactsh"

[tool.hatch.build.targets.wheel]
packages = ["src/interactsh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real Interactsh servers, opt-in via INTERACTSH_LIVE=1",
]
